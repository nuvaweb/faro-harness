# CI del motor faro: la suite completa (sintaxis de módulos, manifiestos, gobierno de ramas,
# digestión/requisitos, guardarraíles).
#
# COSTE (#8): en un repo PRIVADO los minutos de Actions se facturan (Ubuntu 1x · Windows 2x). Por eso:
#   · ESCALONES: Ubuntu primero; Windows solo si Ubuntu pasa, y en Windows el primer fallo cancela el
#     resto (fail-fast): un fallo ya bloquea el merge, seguir gastando no aporta.
#   · PR = TESTS AFECTADOS (test/run.js --afectados=origin/<base>, scripts/tests-afectados.js): solo los
#     tests a los que llega el cambio. Seleccion conservadora: si no es fiable, o el cambio toca la
#     infraestructura de tests o este CI, corre la suite completa.
#   · main / cola de merge / lanzado a mano = SUITE COMPLETA en Ubuntu y Windows: la red de seguridad.
#   · Un push nuevo al mismo PR cancela el run anterior; cada job tiene tiempo maximo.
#   · macOS fuera del CI (10x). Para probarlo a mano: node test/run.js en un Mac.
#
# FARO 3.0 — flujo directo a main: cada PR va a main con auto-merge; este CI es la puerta (los checks
# obligatorios los fija la regla de la rama, que gestiona devops). Al integrarse, el job 'release'
# publica tag + release si plugin.json trae version nueva. La regla de que version pide cada tipo de
# commit vive en plugins/faro/hooks/lib/flujo.js.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# TROZOS (#178): la suite (en serie a proposito) se reparte en 4 trozos en paralelo, por tamaño de
# fichero (test/run.js --trozo=i/n, determinista). Con --afectados se reparte solo la seleccion.
env:
  AFECTADOS: ${{ github.event_name == 'pull_request' && format('--afectados=origin/{0}', github.base_ref) || '' }}

jobs:
  # Escalon 1: barato y rapido. El nombre se mantiene: lo exige la regla de la rama.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        trozo: [1, 2, 3, 4]
    name: test (${{ matrix.os }}, trozo ${{ matrix.trozo }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # --afectados necesita la base y el historial para el merge-base
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # node directo (no `npm test --`): en Windows el shim de npm para PowerShell puede comerse el `--` y cada
      # job correria la suite entera. Mismos flags que `npm test`.
      - run: node test/run.js --test-concurrency=1 --trozo=${{ matrix.trozo }}/4 ${{ env.AFECTADOS }}

  # Escalon 2: Windows, solo si Ubuntu paso (rutas, windowsHide, taskkill...).
  test-windows:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest]
        trozo: [1, 2, 3, 4]
    name: test (${{ matrix.os }}, trozo ${{ matrix.trozo }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node test/run.js --test-concurrency=1 --trozo=${{ matrix.trozo }}/4 ${{ env.AFECTADOS }}

  # Aviso (no rompe): la version de plugin.json sube lo que piden los commits Conventional del PR.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/release-ci.js comprobar --base origin/${{ github.base_ref }}
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}

  # Publicacion automatica: con Ubuntu y Windows en verde en main, tag vX.Y.Z + release con su CHANGELOG
  # si la version es nueva. Un merge de docs/chore no cambia la version y no publica nada.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/release-ci.js publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
